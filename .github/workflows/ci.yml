name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install genvm-linter

      - name: Lint contracts
        run: |
          for f in $(find contracts -name '*.py' -not -name 'interface.py'); do
            echo "== $f =="
            genvm-lint check "$f"
          done
          for f in $(find contracts -name 'interface.py'); do
            echo "== $f (AST-only, not deployable) =="
            genvm-lint lint "$f"
          done

      - name: Unit tests (pure Python, no GenLayer)
        run: pytest tests/unit -v

      - name: Direct-mode tests (GenLayer, no consensus)
        run: pytest tests/direct -v
